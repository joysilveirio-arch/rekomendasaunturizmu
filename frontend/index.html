<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌴 TL Tourism Intelligence</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Leaflet.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">🌴</div>
            <div class="brand-text">
                <span class="brand-title">TL TOURISM</span>
                <span class="brand-subtitle">INTELLIGENCE</span>
            </div>
        </div>
        
        <nav class="sidebar-nav">
            <ul>
                <li><a href="/" class="active" data-page="dashboard"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a></li>
                <li><a href="/static/pages/destinations.html" data-page="destinations"><i class="fas fa-map-marker-alt"></i><span>Destinations</span></a></li>
                <li><a href="/static/pages/reviews.html" data-page="reviews"><i class="fas fa-comments"></i><span>Tourist Reviews</span></a></li>
                <li><a href="/static/pages/recommendations.html" data-page="recommendations"><i class="fas fa-compass"></i><span>Recommendations</span></a></li>
                <li><a href="/static/pages/analytics.html" data-page="analytics"><i class="fas fa-chart-bar"></i><span>Data Analytics</span></a></li>
                <li><a href="/static/pages/clustering.html" data-page="clustering"><i class="fas fa-layer-group"></i><span>Clustering</span></a></li>
                <li><a href="/static/pages/realtime.html" data-page="realtime"><i class="fas fa-bolt"></i><span>Real-Time Monitor</span></a></li>
                <li><a href="/static/pages/about.html" data-page="about"><i class="fas fa-info-circle"></i><span>About Project</span></a></li>
            </ul>
        </nav>
        
        <div class="sidebar-footer">
            <div class="system-status">
                <span class="status-dot online"></span>
                <span>System Online</span>
            </div>
            <button class="theme-toggle" id="themeToggle" title="Toggle Theme">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </aside>
    
    <!-- Main Content -->
    <main class="main-content">
        <!-- Top Navbar -->
        <header class="topbar">
            <button class="sidebar-toggle" id="sidebarToggle">
                <i class="fas fa-bars"></i>
            </button>
            
            <div class="topbar-brand">
                <h1>TL Tourism Intelligence</h1>
            </div>
            
            <div class="topbar-right">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="globalSearch" placeholder="Search destinations..." />
                </div>
                
                <button class="notification-btn" id="notifBtn">
                    <i class="fas fa-bell"></i>
                    <span class="badge">3</span>
                </button>
                
                <button class="theme-toggle topbar-theme-toggle" id="topbarThemeToggle">
                    <i class="fas fa-moon"></i>
                </button>
                
                <div class="user-profile">
                    <span class="user-avatar">A</span>
                    <span class="user-name">Admin</span>
                </div>
            </div>
        </header>
        
        <!-- Page Content -->
        <section class="page-content" id="pageContent">
            <!-- Dynamic content will be loaded here -->
            <div id="appContent">
                <!-- Dashboard will be rendered by dashboard.js -->
                <div id="dashboardContainer"></div>
            </div>
        </section>
    </main>
    
    <!-- JavaScript -->
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/dashboard.js"></script>
    <script src="/static/js/destinations.js"></script>
    <script src="/static/js/reviews.js"></script>
    <script src="/static/js/recommendations.js"></script>
    <script src="/static/js/analytics.js"></script>
    <script src="/static/js/clustering.js"></script>
    <script src="/static/js/realtime.js"></script>
    
    <script>
        // Main application initialization
        document.addEventListener('DOMContentLoaded', function() {
            // Load dashboard by default
            loadDashboard();
            
            // Sidebar toggle
            document.getElementById('sidebarToggle').addEventListener('click', function() {
                document.getElementById('sidebar').classList.toggle('collapsed');
            });
            
            // Theme toggle
            const themeToggles = document.querySelectorAll('.theme-toggle');
            themeToggles.forEach(toggle => {
                toggle.addEventListener('click', function() {
                    document.body.classList.toggle('dark-mode');
                    updateThemeIcons();
                });
            });
            
            // Update theme icons
            function updateThemeIcons() {
                const isDark = document.body.classList.contains('dark-mode');
                const icons = document.querySelectorAll('.theme-toggle i');
                icons.forEach(icon => {
                    if (isDark) {
                        icon.className = 'fas fa-sun';
                    } else {
                        icon.className = 'fas fa-moon';
                    }
                });
            }
            
            // Navigation
            document.querySelectorAll('.sidebar-nav a').forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    const page = this.dataset.page || this.getAttribute('href').split('/').pop().replace('.html', '');
                    navigateTo(page);
                });
            });
            
            // Global search
            document.getElementById('globalSearch').addEventListener('keyup', function(e) {
                if (e.key === 'Enter') {
                    const query = this.value.trim();
                    if (query) {
                        navigateTo('destinations', query);
                    }
                }
            });
            
            // Function to navigate between pages
            window.navigateTo = function(page, query = '') {
                // Update active nav link
                document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
                const targetLink = document.querySelector(`.sidebar-nav a[data-page="${page}"]`);
                if (targetLink) targetLink.classList.add('active');
                
                // Load page content
                switch(page) {
                    case 'dashboard':
                        loadDashboard();
                        break;
                    case 'destinations':
                        loadDestinations(query);
                        break;
                    case 'reviews':
                        loadReviews();
                        break;
                    case 'recommendations':
                        loadRecommendations();
                        break;
                    case 'analytics':
                        loadAnalytics();
                        break;
                    case 'clustering':
                        loadClustering();
                        break;
                    case 'realtime':
                        loadRealtime();
                        break;
                    case 'about':
                        loadAbout();
                        break;
                    default:
                        loadDashboard();
                }
            };
            
            // Load about page
            function loadAbout() {
                const container = document.getElementById('dashboardContainer');
                container.innerHTML = `
                    <div class="page-header">
                        <h2>About Project</h2>
                        <p>Timor-Leste Tourism Data Mining & Real-Time Recommendation System</p>
                    </div>
                    <div class="about-content">
                        <div class="about-card">
                            <h3>Project Overview</h3>
                            <p>This project is a full-stack tourism intelligence platform that collects tourism data from online sources, 
                            stores the data, performs data mining, analyzes tourist reviews, identifies tourism patterns, and generates 
                            personalized recommendations for Timor-Leste.</p>
                        </div>
                        <div class="about-card">
                            <h3>Data Mining Methods</h3>
                            <ul>
                                <li><strong>K-Means Clustering</strong> - Groups destinations by characteristics</li>
                                <li><strong>Sentiment Analysis</strong> - Analyzes tourist reviews</li>
                                <li><strong>Recommendation Engine</strong> - Personalized destination suggestions</li>
                            </ul>
                        </div>
                        <div class="about-card">
                            <h3>Technology Stack</h3>
                            <ul>
                                <li><strong>Frontend:</strong> HTML5, CSS3, Vanilla JavaScript</li>
                                <li><strong>Backend:</strong> Python, FastAPI</li>
                                <li><strong>Data:</strong> Pandas, NumPy, Scikit-learn</li>
                                <li><strong>Database:</strong> SQLite (upgradeable to PostgreSQL)</li>
                            </ul>
                        </div>
                        <div class="about-card">
                            <h3>Key Features</h3>
                            <ul>
                                <li>📊 Interactive Dashboard with KPIs</li>
                                <li>🗺️ Tourism Map with Leaflet.js</li>
                                <li>📈 Real-time Data Collection</li>
                                <li>🧠 Sentiment Analysis</li>
                                <li>🎯 Personalized Recommendations</li>
                                <li>📉 Clustering Visualization</li>
                            </ul>
                        </div>
                    </div>
                `;
            }
            
            // Initial load
            loadDashboard();
            
            // Auto-refresh dashboard every 60 seconds
            setInterval(() => {
                if (document.querySelector('.sidebar-nav a.active')?.dataset.page === 'dashboard') {
                    loadDashboard();
                }
            }, 60000);
        });
    </script>
</body>
</html>
